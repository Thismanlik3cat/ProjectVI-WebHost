<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project V6 - GTA 6 Mods</title>
<meta name="description" content="The first GTA 6 PC launcher with a built-in mod library. Coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    /* Swap for a local file (e.g. "background.jpg") if you prefer */
    --bg-image: url("https://images.hdqwalls.com/wallpapers/gta-6-sunset-4k-ox.jpg");
    --blur: 5px;
    --accent: #ffb27a;           /* warm sunset peach, pulled from the image */
    --pad: clamp(24px, 6vw, 96px);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    background: #1a0f1f;
    color: #fff;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* Background image, lightly blurred (extends past the edges so blur never shows a border) */
  .bg {
    position: fixed;
    inset: -24px;
    background:
      var(--bg-image) center / cover no-repeat,
      linear-gradient(180deg, #3b1d4f, #c4476a 60%, #f29b5b);
    filter: blur(var(--blur));
    opacity: 0;
    animation: fade 1.4s ease-out forwards;
  }

  /* Darkens the bottom-left, where the text sits */
  .tint {
    position: fixed;
    inset: 0;
    background:
      linear-gradient(to top, rgba(14, 8, 20, 0.82) 0%, rgba(14, 8, 20, 0.35) 45%, rgba(14, 8, 20, 0.05) 100%),
      linear-gradient(to right, rgba(14, 8, 20, 0.45) 0%, rgba(14, 8, 20, 0) 60%);
  }

  main {
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: var(--pad) var(--pad) calc(var(--pad) + 28px);
    max-width: 960px;
  }

  .label {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #fff;
  }
  .label::before {
    content: "";
    width: 24px;
    height: 1px;
    background: #fff;
  }

  h1 {
    margin: 0;
    font-weight: 700;
    font-size: clamp(3.2rem, 10vw, 8rem);
    line-height: 1.05;
    letter-spacing: -0.035em;
    text-shadow: 0 6px 48px rgba(0, 0, 0, 0.4);
  }

  .sub {
    margin: 18px 0 0;
    font-size: clamp(1rem, 2.4vw, 1.6rem);
    font-weight: 500;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.82);
  }

  .tagline {
    margin: 36px 0 0;
    max-width: 30ch;
    font-size: clamp(1.05rem, 2vw, 1.3rem);
    line-height: 1.55;
    color: rgba(255, 255, 255, 0.85);
  }
  .tagline strong { color: #fff; font-weight: 600; }

  footer {
    position: fixed;
    left: var(--pad);
    right: var(--pad);
    bottom: 22px;
    font-size: 0.75rem;
    color: rgba(255, 255, 255, 0.55);
  }

  /* Top banner */
  .banner {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 8px 16px;
    padding: 10px 52px 10px 20px;
    background: rgba(14, 8, 20, 0.72);
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    font-size: 0.9rem;
    text-align: center;
    opacity: 0;
    transform: translateY(-100%);
    animation: drop 0.7s 0.2s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
  }
  .banner[hidden] { display: none; }
  .banner p { margin: 0; color: rgba(255, 255, 255, 0.92); }
  .banner .join {
    display: inline-block;
    padding: 7px 16px;
    border-radius: 8px;
    background: #5865f2;
    color: #fff;
    font-size: 0.85rem;
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
    transition: background 0.2s;
  }
  .banner .join:hover { background: #4752c4; }
  .banner .close {
    position: absolute;
    top: 50%;
    right: 12px;
    width: 32px;
    height: 32px;
    margin-top: -16px;
    padding: 0;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: rgba(255, 255, 255, 0.75);
    font-size: 1.4rem;
    line-height: 1;
    cursor: pointer;
    transition: color 0.2s, background 0.2s;
  }
  .banner .close:hover { color: #fff; background: rgba(255, 255, 255, 0.12); }

  /* Gentle entrance */
  .in {
    opacity: 0;
    transform: translateY(12px);
    animation: up 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
  }
  .d1 { animation-delay: 0.3s; }
  .d2 { animation-delay: 0.45s; }
  .d3 { animation-delay: 0.6s; }
  .d4 { animation-delay: 0.75s; }
  .d5 { animation-delay: 1s; }

  @keyframes fade { to { opacity: 1; } }
  @keyframes drop { to { opacity: 1; transform: none; } }
  @keyframes up   { to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    .bg, .in, .banner { animation-duration: 0.01s; animation-delay: 0s; }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="tint" aria-hidden="true"></div>

  <div class="banner" id="banner" role="region" aria-label="Notice">
    <p>This is a temp domain. The official website is coming soon, join our Discord for updates.</p>
    <a class="join" href="https://discord.gg/MFHnwMW5TN" target="_blank" rel="noopener noreferrer">Join Discord</a>
    <button class="close" type="button" aria-label="Close banner" onclick="document.getElementById('banner').hidden = true">&times;</button>
  </div>

  <main>
    <div class="label in d1">Coming soon</div>
    <h1 class="in d2">Project V6</h1>
    <div class="sub in d3">GTA 6 Mods</div>
    <p class="tagline in d4">The first <strong>GTA 6 PC launcher</strong> with a built-in mod library.</p>
  </main>

  <footer class="in d5">Unofficial fan project. Not affiliated with Rockstar Games or Take-Two Interactive.</footer>
</body>
</html>
